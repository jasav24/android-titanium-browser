name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected Chromium version; must match vanadium/args.gn"
        required: false
        type: string
        default: ""
      ref:
        description: "Commit/tag to release; must be the tip of the default branch"
        required: false
        type: string
        default: ""
      publish:
        description: "Create a GitHub release after a successful signed build and a passed device smoke test"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: true
      android_serial:
        description: "Optional adb serial of an attached smoke-test device"
        required: false
        type: string
        default: ""
      preflight_only:
        description: "Only check whether this GitHub-hosted runner can build Chromium, then exit"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: hosted-runner-preflight
    if: inputs.preflight_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Report runner capacity
        run: |
          set -euo pipefail
          {
            echo "## GitHub-hosted runner capacity"
            echo
            echo '```'
            echo "CPUs: $(nproc)"
            free -h
            df -h "$GITHUB_WORKSPACE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce Chromium build prerequisites
        id: capacity
        run: |
          set -euo pipefail
          python3 .github/scripts/discover.py \
            --build-host \
            --repo "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/preflight-report"

      - name: Explain an insufficient hosted runner
        if: failure() && steps.capacity.outcome == 'failure'
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## This hosted runner cannot build Chromium

          Chromium for Android needs about **100 GiB of free disk**, and this
          runner falls short. The check intentionally fails here instead of
          starting a multi-hour build that would exhaust the disk.

          Options, in order of preference:

          1. Run the workflow on a **GitHub-hosted larger runner** with at least
             150 GB SSD and 16+ cores (GitHub Team/Enterprise billing required).
             Change `runs-on` to that runner's label; nothing else changes.
          2. Use a dedicated Linux build host with >= 100 GiB free disk.
          3. Do not lower `build.min_free_disk_gib` in `.github/ui-protection.yml`
             to force a build on an 85 GiB runner; it will fail mid-build.
          MD
          echo "::error::Hosted runner capacity is below the Chromium build requirement; see the job summary."

  plan:
    name: plan-release
    if: inputs.preflight_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      retention_days: ${{ steps.manifest.outputs.artifact_retention_days }}
      state_branch: ${{ steps.manifest.outputs.state_branch }}
    steps:
      - name: Checkout default branch and submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Read manifest policy
        id: manifest
        run: python3 .github/scripts/manifest_info.py

      - name: Resolve the release commit and version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          tip="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"
          target="$tip"
          if [ -n "${INPUT_REF:-}" ]; then
            if git rev-parse --verify --quiet "${INPUT_REF}^{commit}" >/dev/null; then
              target="$(git rev-parse "${INPUT_REF}^{commit}")"
            else
              if ! git fetch --no-tags --quiet origin "$INPUT_REF"; then
                echo "::error::could not fetch release ref ${INPUT_REF}"
                exit 1
              fi
              target="$(git rev-parse "FETCH_HEAD^{commit}")"
            fi
          fi
          if [ "$target" != "$tip" ]; then
            echo "::error::release ref ${INPUT_REF:-$DEFAULT_BRANCH} is ${target}, not the default branch tip ${tip}. Merge first."
            exit 1
          fi

          version="$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn || true)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::could not read a four-part version from vanadium/args.gn"
            exit 1
          fi
          if [ -n "${INPUT_VERSION:-}" ] && [ "$INPUT_VERSION" != "$version" ]; then
            echo "::error::requested version ${INPUT_VERSION} does not match ${version} in vanadium/args.gn"
            exit 1
          fi

          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null \
             || gh api "repos/${REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists"
            exit 1
          fi
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::a GitHub release for ${tag} already exists"
            exit 1
          fi

          {
            echo "sha=$target"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Planning release ${tag} at ${target}"

  build:
    name: release-build
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      tree: ${{ steps.verify.outputs.tree }}
      artifact_name: ${{ steps.verify.outputs.artifact_name }}
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
      package_id: ${{ steps.verify.outputs.package_id }}
      smoke_passed: ${{ steps.smoke.outputs.passed }}
      smoke_status: ${{ steps.smoke.outputs.status }}
      smoke_reason: ${{ steps.smoke.outputs.reason }}
    steps:
      - name: Validate release signing prerequisites
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          LOCAL_PROPERTIES_B64: ${{ secrets.RELEASE_LOCAL_PROPERTIES_B64 }}
          CERT_PIN: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 is not set in the release environment."
            missing=1
          fi
          if [ -z "$LOCAL_PROPERTIES_B64" ]; then
            echo "::error::RELEASE_LOCAL_PROPERTIES_B64 is not set in the release environment."
            missing=1
          fi
          if [ -z "$CERT_PIN" ]; then
            echo "::error::repository variable RELEASE_CERT_SHA256 is not set; a release build must pin the signing certificate."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Release signing material and certificate pin are present."

      - name: Checkout release commit and submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Preflight build host
        id: capacity
        run: |
          set -euo pipefail
          {
            echo "## Build host capacity"
            echo
            echo '```'
            echo "CPUs: $(nproc)"
            free -h
            df -h "$GITHUB_WORKSPACE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/discover.py \
            --build-host \
            --repo "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/build-preflight"

      - name: Explain an insufficient hosted runner
        if: failure() && steps.capacity.outcome == 'failure'
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Build aborted before checkout

          Chromium for Android needs about **100 GiB of free disk**; this
          `ubuntu-latest` runner does not provide it. The preflight fails fast
          instead of filling the disk during `gclient sync` or the build.

          Use a GitHub-hosted larger runner with >= 150 GB SSD and 16+ cores,
          or a dedicated Linux build host with >= 100 GiB free disk.
          MD
          echo "::error::Insufficient runner capacity for a Chromium Android build; see the job summary."

      - name: Build and sign the ARM64 APK
        timeout-minutes: 330
        env:
          LOCAL_TEST_JKS: ${{ secrets.RELEASE_LOCAL_PROPERTIES_B64 }}
          STORE_TEST_JKS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          BUILD_ABIS: arm64
          BUILD_BUNDLE: "false"
          SYMBOL_LEVEL: "0"
          KEYSTORE_TYPE: ${{ vars.KEYSTORE_TYPE || 'PKCS12' }}
        run: |
          set -euo pipefail
          umask 077
          chmod +x build.sh common.sh patch.sh
          ./build.sh

      - name: Verify the signed ARM64 artifact
        id: verify
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_CERT: ${{ vars.RELEASE_CERT_SHA256 }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(chromium/src/out/release/*.apk)
          aabs=(chromium/src/out/release/*.aab)
          if [ "${#aabs[@]}" -ne 0 ]; then
            echo "::error::release builds must not produce an AAB; found ${aabs[*]}"
            exit 1
          fi
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one APK in chromium/src/out/release, found ${#apks[@]}"
            find chromium/src/out/release -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi
          apk="${apks[0]}"
          case "$apk" in
            *-arm64-v8a.apk) ;;
            *)
              echo "::error::expected an arm64-v8a APK, found $(basename "$apk")"
              exit 1
              ;;
          esac

          mkdir -p artifacts
          cp "$apk" artifacts/

          version="$(basename "$apk")"
          version="${version%-arm64-v8a.apk}"
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::built version ${version} does not match the plan ${EXPECTED_VERSION}"
            exit 1
          fi
          tree="$(git rev-parse HEAD^{tree})"

          build_tools="$(find chromium/src/third_party/android_sdk/public/build-tools \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1 || true)"
          apksigner="$build_tools/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found in ${build_tools}"
            exit 1
          fi
          if ! "$apksigner" verify "$apk"; then
            echo "::error::the APK signature does not verify"
            exit 1
          fi
          cert_sha256="$("$apksigner" verify --print-certs "$apk" \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' \
            | tr -d ':' | tr 'A-F' 'a-f' || true)"
          if [ -z "$cert_sha256" ]; then
            echo "::error::could not read the signing certificate SHA-256 from the APK"
            exit 1
          fi
          if [ -z "${EXPECTED_CERT:-}" ]; then
            echo "::error::RELEASE_CERT_SHA256 is not set; refusing an unpinned release build."
            exit 1
          fi
          pinned="$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr 'A-F' 'a-f')"
          if [ "$pinned" != "$cert_sha256" ]; then
            echo "::error::APK signing certificate ${cert_sha256} does not match RELEASE_CERT_SHA256 ${pinned}"
            exit 1
          fi

          if [ -x "$build_tools/aapt" ]; then
            dump_cmd=("$build_tools/aapt" dump badging)
          else
            dump_cmd=("$build_tools/aapt2" dump badging)
          fi
          badging="$("${dump_cmd[@]}" "$apk")"
          expected_pkg="$(grep -o 'chrome_public_manifest_package = "[^"]*"' args.gn \
            | head -n1 | cut -d'"' -f2 || true)"
          if [ -z "$expected_pkg" ] || ! printf '%s' "$badging" | grep -q "package: name='${expected_pkg}'"; then
            echo "::error::built APK package id does not match args.gn (${expected_pkg:-missing})"
            exit 1
          fi
          if ! printf '%s' "$badging" | grep -q "versionName='${version}'"; then
            echo "::error::built APK versionName does not match ${version}"
            exit 1
          fi
          if ! printf '%s' "$badging" | grep -Eq "native-code:.*'arm64-v8a'"; then
            echo "::error::the APK does not contain arm64-v8a native code"
            printf '%s\n' "$badging" | grep -m1 'native-code'
            exit 1
          fi

          (cd artifacts && sha256sum ./*.apk > SHA256SUMS)
          {
            echo "version=$version"
            echo "tree=$tree"
            echo "artifact_name=titanium-release-${version}-${tree:0:12}"
            echo "cert_sha256=$cert_sha256"
            echo "package_id=$expected_pkg"
            echo "commit=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Verified signed ARM64 ${version} for tree ${tree}"

      - name: Install and smoke test on a device (optional)
        id: smoke
        env:
          ANDROID_SERIAL_INPUT: ${{ inputs.android_serial }}
          PACKAGE_ID: ${{ steps.verify.outputs.package_id }}
        run: |
          set -uo pipefail

          status="skipped"
          passed="false"
          reason=""
          serial=""
          abi=""
          sdk=""
          model=""
          fingerprint=""
          launched="false"

          finish() {
            {
              echo "# Device smoke test"
              echo
              printf -- '- Status: **%s**\n' "$status"
              printf -- '- Passed: `%s`\n' "$passed"
              printf -- '- Package: `%s`\n' "${PACKAGE_ID:-unknown}"
              if [ -n "$serial" ]; then printf -- '- Serial: `%s`\n' "$serial"; fi
              if [ -n "$model" ]; then printf -- '- Model: `%s`\n' "$model"; fi
              if [ -n "$abi" ]; then printf -- '- ABI: `%s`\n' "$abi"; fi
              if [ -n "$sdk" ]; then printf -- '- SDK: `%s`\n' "$sdk"; fi
              if [ -n "$fingerprint" ]; then printf -- '- Fingerprint: `%s`\n' "$fingerprint"; fi
              printf -- '- Launched: `%s`\n' "$launched"
              printf -- '- Reason: %s\n' "${reason:-none}"
            } > smoke-report.md
            {
              echo "passed=$passed"
              echo "status=$status"
              echo "reason=${reason//$'\n'/ }"
            } >> "$GITHUB_OUTPUT"
            if [ "$passed" = "true" ]; then
              echo "Device smoke test passed."
            else
              echo "::warning::Smoke test ${status}: ${reason}"
            fi
            exit 0
          }

          adb_bin="$PWD/chromium/src/third_party/android_sdk/public/platform-tools/adb"
          if [ ! -x "$adb_bin" ]; then
            status="failed"
            reason="adb was not found at chromium/src/third_party/android_sdk/public/platform-tools/adb"
            finish
          fi
          if [ -n "${ANDROID_SERIAL_INPUT:-}" ]; then
            export ANDROID_SERIAL="$ANDROID_SERIAL_INPUT"
            if [[ "$ANDROID_SERIAL_INPUT" == *:* ]]; then
              "$adb_bin" connect "$ANDROID_SERIAL_INPUT" || true
            fi
          fi
          serial="$("$adb_bin" get-serialno 2>/dev/null)"
          if [ -z "$serial" ] || [ "$serial" = "unknown" ]; then
            status="skipped"
            serial=""
            reason="no attached Android device matched${ANDROID_SERIAL_INPUT:+ serial ${ANDROID_SERIAL_INPUT}}; GitHub-hosted runners provide none by default, so the smoke test cannot run"
            "$adb_bin" devices -l >&2
            finish
          fi

          abi="$("$adb_bin" shell getprop ro.product.cpu.abi | tr -d '\r')"
          sdk="$("$adb_bin" shell getprop ro.build.version.sdk | tr -d '\r')"
          model="$("$adb_bin" shell getprop ro.product.model | tr -d '\r')"
          fingerprint="$("$adb_bin" shell getprop ro.build.fingerprint | tr -d '\r')"
          if ! printf '%s' "$abi" | grep -Eq '^arm64'; then
            status="failed"
            reason="device ${serial} reports ABI ${abi}, but the release APK is arm64-v8a"
            finish
          fi

          if ! "$adb_bin" install -r artifacts/*-arm64-v8a.apk; then
            status="failed"
            reason="adb install failed on device ${serial}"
            finish
          fi
          "$adb_bin" logcat -c || true
          if ! "$adb_bin" shell monkey -p "$PACKAGE_ID" -c android.intent.category.LAUNCHER 1; then
            status="failed"
            reason="the launcher intent could not be dispatched"
            finish
          fi
          for attempt in $(seq 1 30); do
            if "$adb_bin" shell pidof "$PACKAGE_ID" >/dev/null 2>&1; then
              launched="true"
              break
            fi
            sleep 2
          done
          if [ "$launched" != "true" ]; then
            status="failed"
            reason="the app process did not start within 60 seconds"
            "$adb_bin" logcat -d -b crash -v brief > "$RUNNER_TEMP/crash.log" 2>&1 || true
            tail -n 200 "$RUNNER_TEMP/crash.log" || true
            finish
          fi
          sleep 5
          if ! "$adb_bin" shell dumpsys activity activities \
              | grep -E 'mResumedActivity|topResumedActivity' | grep -q "$PACKAGE_ID"; then
            echo "::warning::the app process is alive but is not the resumed activity"
          fi
          "$adb_bin" exec-out screencap -p > smoke.png || true
          "$adb_bin" logcat -d -b crash -v brief > "$RUNNER_TEMP/crash.log" 2>&1 || true
          if grep -q "$PACKAGE_ID" "$RUNNER_TEMP/crash.log"; then
            status="failed"
            reason="the app wrote a crash entry during the smoke test"
            tail -n 200 "$RUNNER_TEMP/crash.log" || true
            finish
          fi
          "$adb_bin" shell am force-stop "$PACKAGE_ID" || true

          status="passed"
          passed="true"
          finish

      - name: Assemble release metadata
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          TREE: ${{ steps.verify.outputs.tree }}
          COMMIT: ${{ steps.verify.outputs.commit }}
          PACKAGE_ID: ${{ steps.verify.outputs.package_id }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
          SMOKE_PASSED: ${{ steps.smoke.outputs.passed }}
          SMOKE_STATUS: ${{ steps.smoke.outputs.status }}
          SMOKE_REASON: ${{ steps.smoke.outputs.reason }}
        run: |
          set -euo pipefail
          cp smoke.png artifacts/ 2>/dev/null || true
          test -s smoke-report.md
          cp smoke-report.md artifacts/smoke-report.md
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          artifacts = Path("artifacts")
          files = []
          for path in sorted(artifacts.iterdir()):
              if path.name in {"SHA256SUMS", "release-manifest.json"}:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append(
                  {"name": path.name, "sha256": digest, "size": path.stat().st_size}
              )
          report = {
              "schema_version": 1,
              "version": os.environ["VERSION"],
              "commit": os.environ["COMMIT"],
              "tree": os.environ["TREE"],
              "package_id": os.environ["PACKAGE_ID"],
              "signing_certificate_sha256": os.environ["CERT_SHA256"],
              "build": {
                  "runner": "ubuntu-latest",
                  "abis": ["arm64"],
                  "bundle": False,
                  "symbol_level": 0,
              },
              "artifacts": files,
              "smoke_test": {
                  "passed": os.environ.get("SMOKE_PASSED") == "true",
                  "status": os.environ.get("SMOKE_STATUS") or "unknown",
                  "reason": os.environ.get("SMOKE_REASON") or "",
                  "report": "smoke-report.md",
              },
              "built_at": datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z"),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
          }
          (artifacts / "release-manifest.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.verify.outputs.artifact_name || format('titanium-release-{0}', github.run_id) }}
          path: |
            artifacts/
            build-preflight/
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.retention_days || 14 }}

      - name: Report build failure diagnostics
        if: failure()
        run: |
          set +e
          {
            echo "## Build failure diagnostics"
            echo
            echo '```'
            nproc
            free -h
            df -h "$GITHUB_WORKSPACE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "chromium/src/out/release/*" >/dev/null; then
            ls -l chromium/src/out/release
          fi
          if [ -d chromium ]; then
            du -sh chromium
          fi
          oom="$(sudo dmesg 2>/dev/null | grep -iE 'out of memory|killed process' || true)"
          if [ -n "$oom" ]; then
            printf '%s\n' "$oom" | tail -n 20
            echo "::warning::the kernel log reports memory pressure or an OOM kill"
          fi
          echo "Inspect the failed step above for the first error; later steps may have been skipped."

  record:
    name: record-release-build
    needs:
      - plan
      - build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: automation-state-write
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout trusted automation scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Prepare durable state worktree
        env:
          STATE_BRANCH: ${{ needs.plan.outputs.state_branch }}
        run: |
          set -euo pipefail
          bash .github/scripts/state_branch.sh prepare \
            "$RUNNER_TEMP/automation-state" \
            "$STATE_BRANCH"

      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ github.workspace }}/downloaded

      - name: Record the release build
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=("$GITHUB_WORKSPACE"/downloaded/artifacts/*-arm64-v8a.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::expected exactly one recorded ARM64 APK, found ${#apks[@]}"
            exit 1
          fi
          args=(
            --state-dir "$RUNNER_TEMP/automation-state"
            --tree "$TREE"
            --ref "$RELEASE_SHA"
            --kind release
            --signing release
            --repository "$REPO"
            --run-url "$RUN_URL"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --result success
          )
          shopt -s nullglob
          for file in "$GITHUB_WORKSPACE"/downloaded/artifacts/*; do
            if [ -f "$file" ]; then
              args+=(--artifact "$(basename "$file")=$file")
            fi
          done
          python3 .github/scripts/build_record.py "${args[@]}"

      - name: Save durable state
        env:
          STATE_BRANCH: ${{ needs.plan.outputs.state_branch }}
          TAG: ${{ needs.plan.outputs.tag }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          set -euo pipefail
          bash .github/scripts/state_branch.sh save \
            "$RUNNER_TEMP/automation-state" \
            "$STATE_BRANCH" \
            "release: ${TAG} ${TREE} (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})"

  publish:
    name: publish-release
    needs:
      - plan
      - build
      - record
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require a passed device smoke test
        if: needs.build.outputs.smoke_passed != 'true'
        env:
          SMOKE_STATUS: ${{ needs.build.outputs.smoke_status }}
          SMOKE_REASON: ${{ needs.build.outputs.smoke_reason }}
        run: |
          echo "::error::Refusing to publish: the device smoke test did not pass (status: ${SMOKE_STATUS:-unknown}). Reason: ${SMOKE_REASON:-none}. Re-run with an attached arm64 device via the android_serial input."
          exit 1

      - name: Checkout default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Re-verify the release target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          tip="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"
          if [ "$RELEASE_SHA" != "$tip" ]; then
            echo "::error::the release commit is no longer the tip of ${DEFAULT_BRANCH}; refusing to publish."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null \
             || gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists"
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::release ${TAG} already exists"
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ github.workspace }}/downloaded

      - name: Verify downloaded artifact integrity
        env:
          TREE: ${{ needs.build.outputs.tree }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd downloaded/artifacts
          test -s SHA256SUMS || { echo "::error::SHA256SUMS is missing or empty"; exit 1; }
          test -s release-manifest.json || { echo "::error::release-manifest.json is missing or empty"; exit 1; }
          test -s smoke-report.md || { echo "::error::smoke-report.md is missing or empty"; exit 1; }
          apks=(./*-arm64-v8a.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::expected exactly one ARM64 APK, found ${#apks[@]}"
            exit 1
          fi
          aabs=(./*.aab)
          if [ ${#aabs[@]} -ne 0 ]; then
            echo "::error::an AAB is present but release publishing is APK-only"
            exit 1
          fi
          sha256sum -c SHA256SUMS
          if [ "$(git -C "$GITHUB_WORKSPACE" rev-parse "${RELEASE_SHA}^{tree}")" != "$TREE" ]; then
            echo "::error::recorded tree does not match the release commit"
            exit 1
          fi
          jq -e --arg version "$VERSION" --arg tree "$TREE" --arg commit "$RELEASE_SHA" \
            '.version == $version and .tree == $tree and .commit == $commit
             and .smoke_test.passed == true
             and (.artifacts | map(.name) | any(endswith("-arm64-v8a.apk")))' \
            release-manifest.json >/dev/null
          grep -Fq 'Result: **passed**' smoke-report.md 2>/dev/null \
            || grep -Fq 'Status: **passed**' smoke-report.md
          ls -l

      - name: Verify the durable release marker
        env:
          STATE_BRANCH: ${{ needs.plan.outputs.state_branch }}
          TREE: ${{ needs.build.outputs.tree }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            "+refs/heads/${STATE_BRANCH}:refs/remotes/automation-state"
          marker_ref="refs/remotes/automation-state:builds/${TREE}.json"
          if ! git cat-file -e "$marker_ref" 2>/dev/null; then
            echo "::error::no recorded release build marker for tree ${TREE} on ${STATE_BRANCH}"
            exit 1
          fi
          git show "$marker_ref" > "$RUNNER_TEMP/build-marker.json"
          python3 .github/scripts/verify_release_artifacts.py \
            --marker "$RUNNER_TEMP/build-marker.json" \
            --artifacts "$GITHUB_WORKSPACE/downloaded/artifacts" \
            --tree "$TREE" \
            --ref "$RELEASE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --repository "$REPO"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: 'downloaded/artifacts/*-arm64-v8a.apk'

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts="downloaded/artifacts"
          apks=("$artifacts"/*-arm64-v8a.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::expected exactly one ARM64 APK to publish, found ${#apks[@]}"
            exit 1
          fi
          for required in SHA256SUMS release-manifest.json smoke-report.md; do
            if [ ! -s "$artifacts/$required" ]; then
              echo "::error::missing release asset: $required"
              exit 1
            fi
          done
          args=(
            --repo "$REPO"
            --target "$RELEASE_SHA"
            --title "Titanium ${VERSION}"
            --generate-notes
          )
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          assets=(
            "${apks[0]}"
            "$artifacts/SHA256SUMS"
            "$artifacts/release-manifest.json"
            "$artifacts/smoke-report.md"
          )
          gh release create "$TAG" "${args[@]}" "${assets[@]}"
          echo "Release ${TAG} created for ${RELEASE_SHA} with ${#assets[@]} assets."
