name: Chained build

# Chromium does not finish inside GitHub's 360-minute job limit on a 4-core
# hosted runner, so the build is split across several dispatched jobs and the
# prepared checkout travels between them:
#
#   reclaim disk -> restore chromium/ from the build-cache release
#                -> compile for build_minutes
#                -> re-upload chromium/ -> dispatch again
#
# chromium/ carries both the patched source and out/Default, which is what lets
# the next job's ninja continue instead of starting over. The last step queues
# the next session on its own, so one dispatch runs the whole chain until the
# titanium-arm64-unsigned artifact appears. action=reset ignores the cache and
# builds from scratch; action=sign skips the build job completely and signs the
# unsigned APK the last chain published; auto_chain=false leaves queueing to you.
# A session that restores a tree which already holds the APK compiles nothing at
# all: it uploads that APK and goes straight to signing, so re-dispatching a
# finished chain costs one restore instead of another five hours.
#
# Progress is checked between sessions: the pending-target count each session
# reports is stored in the cache manifest, and a session that removes less than
# min_progress of them stops the chain instead of re-building the same objects
# for another five hours.
#
# The build job compiles with SIGN_RELEASE=false, i.e. the release key never
# enters a six-hour job that also runs shell from the checkout. A session that
# ends with an APK hands it to the short `publish` job below, which signs it
# with the keystore from the `release` environment and uploads the result to a
# GitHub release. Until those secrets exist it publishes the unsigned build as
# a prerelease instead.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "continue from the cached checkout, reset and build from scratch, probe the cache without building, or sign the already-published unsigned APK without building"
        required: true
        type: choice
        options:
          - continue
          - reset
          - probe
          - sign
        default: continue
      build_minutes:
        description: "Minutes of compilation this job may attempt (keep at or below 300)"
        required: true
        type: string
        default: "300"
      auto_chain:
        description: "Queue the next session automatically when this one ends without an APK"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      max_sessions:
        description: "Stop the chain after this many sessions since the last cold build"
        required: true
        type: string
        default: "24"
      min_progress:
        description: "Fewest pending targets a session must clear before the chain is queued again"
        required: true
        type: string
        default: "2000"

permissions:
  contents: write   # the cache is stored as assets on the `build-cache` release
  # Without this the last step dies with
  # "could not create workflow dispatch event: HTTP 403: Resource not
  # accessible by integration": an explicit `permissions:` block above replaces
  # the runner's default set, and the POST to /actions/workflows/.../dispatches
  # is an Actions write, not a contents write. `workflows: write` is not a valid
  # key here (the file itself would 422); `actions: write` is the one that
  # authorises the self-dispatch.
  actions: write

concurrency:
  # Every mutating action shares one group so two sessions cannot write the
  # cache at once; the read-only probe is allowed to run alongside a build.
  group: chained-build-${{ inputs.action == 'probe' && 'probe' || inputs.action == 'sign' && 'sign' || 'build' }}
  cancel-in-progress: false

jobs:
  build:
    # action=sign publishes the APK a previous chain already produced, so this
    # job - the only expensive one - is skipped entirely for it.
    if: inputs.action != 'sign'
    outputs:
      # Read by the publish job below. A probe session has no tree and a session
      # that ran out of budget has no APK, so both report false and publishing
      # is skipped without another download.
      has_apk: ${{ steps.hasapk.outputs.value }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          echo "free before: $(df -BG --output=avail / | tail -1 | awk '{print $1}')"
          # Preinstalled toolchains this build never touches. The image has
          # ~84 GiB free, and a Chromium checkout plus out/ needs more.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift /opt/az /usr/local/aws-cli /opt/microsoft \
            /usr/local/share/powershell /usr/lib/mono
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          echo "free after: $(df -BG --output=avail / | tail -1 | awk '{print $1}')"

      - name: Checkout the build scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          clean: false              # chromium/ from the cache lives in the same workspace
          submodules: recursive     # vanadium/args.gn and vanadium/patches drive build.sh

      - name: Restore the cached checkout
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's release-asset CDN resets long downloads at random, and one
          # reset used to kill a whole session 45 s into a 6-minute restore:
          #   read tcp 10.1.0.202:38188->185.199.109.133:443: read: connection reset by peer
          # A 14-part archive is 14 chances to hit that, so every asset transfer
          # is retried instead of failing the job.
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::gave up after $n attempts: $*" >&2
                return 1
              fi
              echo "attempt $n failed for: $* (retrying in $((n * 20))s)" >&2
              sleep $((n * 20))
            done
          }
          generation=0
          pending=''
          case '${{ inputs.action }}' in
            continue|probe) resume_cache=true ;;
            *) resume_cache=false ;;
          esac
          if [ "$resume_cache" = "true" ] \
             && gh release view build-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p cache
            retry gh release download build-cache --repo "$GITHUB_REPOSITORY" \
              --pattern manifest.txt --dir cache --clobber || true
            if [ ! -f cache/manifest.txt ]; then
              echo "::notice::the build-cache release has no manifest yet; starting cold"
              echo "generation=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cached_commit=$(sed -n 's/^commit=//p' cache/manifest.txt)
            cached_recipe=$(sed -n 's/^recipe=//p' cache/manifest.txt)
            generation=$(sed -n 's/^generation=//p' cache/manifest.txt)
            parts=$(sed -n 's/^parts=//p' cache/manifest.txt)
            pending=$(sed -n 's/^remaining=//p' cache/manifest.txt)
            tag=$(printf 'g%03d' "$generation")
            # The tree is reusable only when the inputs that shape it are the
            # same: the patch series, args.gn, .gclient and the vanadium
            # checkout. Comparing commits was too strict — a workflow-only
            # commit threw away a perfectly good tree — and too loose the other
            # way: a new patch series under the same commit would resume a tree
            # that never received it.
            recipe=$(
              { cat args.gn patch.sh .gclient 2>/dev/null
                git -C vanadium rev-parse HEAD 2>/dev/null || echo no-vanadium
              } | sha256sum | cut -d' ' -f1
            )
            restore=false
            if [ -z "$cached_recipe" ]; then
              echo "::warning::$tag carries no recipe fingerprint (older generation); resuming because action=continue, but use action=reset if the patch series changed"
              restore=true
            elif [ "$cached_recipe" = "$recipe" ]; then
              restore=true
            else
              echo "::notice::$tag was prepared from recipe $cached_recipe, this checkout is $recipe; starting cold"
            fi
            if [ "$restore" = "true" ]; then
              echo "restoring $tag ($parts parts, built from $cached_commit)"
              # One pattern download would restart all 1500M parts from zero on a
              # reset, so each part is fetched and re-fetched on its own.
              for p in $(seq -f '%03g' 0 $((parts - 1))); do
                while [ ! -s "cache/${tag}-part-${p}" ]; do
                  retry gh release download build-cache --repo "$GITHUB_REPOSITORY" \
                    --pattern "${tag}-part-${p}" --dir cache --clobber
                done
              done
              found=$(find cache -maxdepth 1 -name "${tag}-part-*" | wc -l)
              if [ "$found" -ne "$parts" ]; then
                echo "::error::cache generation $tag is incomplete: $found of $parts parts"
                exit 1
              fi
              find cache -maxdepth 1 -name "${tag}-part-*" | sort | xargs cat \
                | tar -I zstd -xf - -C "$GITHUB_WORKSPACE"
              rm -f cache/"${tag}"-part-*
              echo "restored: $(du -sh chromium | cut -f1)"
              # The two numbers that say whether the cache carried work forward.
              # Written as annotations: a running job's log is not readable from
              # the API, but its annotations are. subSecondObjects is the proof
              # that the archive preserved mtime precision; if it is 0, siso
              # will consider every restored object stale again.
              echo "::notice::resumed tree objects=$(find chromium/src/out -name '*.o' 2>/dev/null | wc -l) ninjaLog=$(wc -l < chromium/src/out/Default/.ninja_log 2>/dev/null || echo 0) subSecondObjects=$( { find chromium/src/out/Default/obj -name '*.o' -printf '%.9T@\n' 2>/dev/null | grep -vc '\.000000000$'; } || true) state=$(ls -a chromium/src/out/Default 2>/dev/null | grep -E '^\.(ninja|siso)' | tr '\n' ' ')"
            fi
            rm -f cache/manifest.txt
          fi
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "pending=${pending:-}" >> "$GITHUB_OUTPUT"
          # Whether the tree arrived with a finished APK already in it. The build
          # step uses this to skip compiling a job that is already done, and the
          # save step uses it to tell "this session completed the build" (worth
          # caching, or the next one replays it) from "nothing changed" (not).
          if compgen -G "chromium/src/out/release/*.apk" >/dev/null; then
            echo "had_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "had_apk=false" >> "$GITHUB_OUTPUT"
          fi
          df -h /

      # Read-only: answers where siso keeps its build state and whether the
      # archive carries it. Nothing here compiles, saves the cache, or chains.
      - name: Inspect the cached tree
        if: inputs.action == 'probe'
        run: |
          # A diagnostic: every line must report, so no failed probe may abort
          # the step. The runner starts bash with -e; turn it back off.
          set +e
          set -u
          cd "$GITHUB_WORKSPACE"
          outdir=chromium/src/out/Default
          nlog=$outdir/.ninja_log
          objects=$(find chromium/src/out -name '*.o' 2>/dev/null | wc -l)
          rows=$( [ -f "$nlog" ] && wc -l < "$nlog" || echo absent )
          logged=$( [ -f "$nlog" ] && tail -n +2 "$nlog" | cut -f1 | sort -u | wc -l || echo 0 )
          newer=$( [ -f "$nlog" ] && find "$outdir/obj" -name '*.o' -newer "$nlog" 2>/dev/null | wc -l || echo 0 )
          logstamp=$( [ -f "$nlog" ] && date -u -r "$nlog" +%Y-%m-%dT%H:%M:%SZ || echo absent )
          newest=$(find "$outdir/obj" -name '*.o' -printf '%T@\t%p\n' 2>/dev/null | sort -rn | head -1 | cut -f2-)
          neweststamp=$( [ -n "$newest" ] && date -u -r "$newest" +%Y-%m-%dT%H:%M:%SZ || echo none )
          prepared=$( [ -f "$outdir/.titanium-prepared" ] && echo yes || echo no )
          state=$(ls -a "$outdir" 2>/dev/null | grep -E '^(\.|siso)' | tr '\n' ' ')
          outside=$(find "$HOME" /tmp -maxdepth 5 \( -iname '*siso*' -o -name '.ninja_log' \) 2>/dev/null | head -12 | tr '\n' ' ')
          echo "::notice::probe objects=$objects ninjaLogRows=$rows ninjaLogOutputs=$logged objectsNewerThanLog=$newer"
          echo "::notice::probe logMtime=$logstamp newestObjectMtime=$neweststamp prepared=$prepared"
          echo "::notice::probe outDefaultState=$state"
          echo "::notice::probe stateOutsideTree=${outside:-none}"
          if [ "$objects" = "0" ]; then
            echo "::error::the restored tree contains no object files, so the archive is not carrying out/"
          fi
          echo "prepared=$prepared  newest=$newest"
          ls -la --time-style=+%Y-%m-%dT%H:%M "$outdir" 2>/dev/null | head -25
          du -sh "$outdir" 2>/dev/null
          # siso writes its dirty-reason log into the output dir, and the tree
          # carries eight generations of it. That file names the reason every
          # resumed session rebuilds the same objects, so read it before
          # changing anything else.
          echo "--- siso log files ---"
          stat -c '%n %s %y' "$outdir"/siso_explain* "$outdir"/siso_result.json \
            "$outdir"/siso_metadata.json "$outdir"/.siso_fs_state* 2>/dev/null
          ex=$outdir/siso_explain
          if [ -f "$ex" ]; then
            echo "--- explain head ---"
            head -n 40 "$ex"
            # The reason lines carry a unique mtime and a unique target name, so
            # an unnormalised `uniq -c` returns 1 for everything. Collapse both
            # before counting.
            echo "--- explain reason tally (newest rotation) ---"
            sed -e 's/"[^"]*"/NAME/g' -e 's/deps for [^ ]*/deps for TARGET/g' \
                -e 's/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9] [0-9:.+]* UTC/TS/g' \
                "$ex" | cut -c1-100 | sort | uniq -c | sort -rn | head -n 12
            # siso rotates this log once per session, so each file is one
            # session's verdict on the tree it resumed. Comparing the counts down
            # the rotations is the before/after for the archive mtime fix.
            echo "--- explain per rotation ---"
            per=/tmp/explain-per.txt
            : > "$per"
            for f in "$outdir"/siso_explain*; do
              [ -f "$f" ] || continue
              lines=$(wc -l < "$f")
              stale=$(grep -ac 'older than log' "$f" || true)
              printf '%s %s lines=%s olderThanLog=%s\n' \
                "$(date -u -r "$f" +%m%d%H%M)" "$(basename "$f")" "$lines" "${stale:-?}" >> "$per"
            done
            sort -r "$per" | sed 's/^[0-9]* //' | tr '\n' ';' | cut -c1-900
            echo "::notice::explain per rotation (newest first): $(sort -r "$per" | sed 's/^[0-9]* //' | tr '\n' ';' | cut -c1-900)"
          fi
          echo "--- siso_result.json ---"
          head -c 1200 "$outdir/siso_result.json" 2>/dev/null
          echo
          echo "--- how the build was invoked ---"
          head -c 900 "$outdir/siso_metadata.json" 2>/dev/null
          echo
          df -h /

      - name: Build for this session
        id: build
        # had_apk comes from the restore step: a chain that resumes a tree which
        # already holds the finished APK has nothing left to compile, so it falls
        # through to the upload and publish steps instead of spending five hours
        # re-deriving objects siso already has.
        if: inputs.action != 'probe' && steps.restore.outputs.had_apk != 'true'
        continue-on-error: true
        timeout-minutes: 320
        env:
          BUILD_ABIS: arm64
          BUILD_BUNDLE: "false"
          SIGN_RELEASE: "false"
          SYMBOL_LEVEL: "0"
          RESUME: "1"
        run: |
          set -o pipefail
          # The runner invokes this as `bash -e`, so the failed pipeline below
          # would end the step before its status is recorded.
          set +e
          budget="${{ inputs.build_minutes }}"
          case "$budget" in
            ''|*[!0-9]*) echo "::error::build_minutes must be a number of minutes" >&2; exit 2 ;;
          esac
          # SIGINT reaches autoninja's whole process group, so ninja stops with a
          # consistent out/ instead of being killed at the job's own timeout.
          timeout --signal=INT --kill-after=120s "${budget}m" \
            ./build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "124" ]; then
            echo "::notice::the session budget expired; the build was stopped and the tree will be cached"
            exit 0
          fi
          exit "$status"

      - name: Report progress
        id: progress
        if: always()
        run: |
          set -euo pipefail
          if [ -f build.log ]; then
            last=$(grep -oE '\[[0-9]+/[0-9]+\]' build.log | tail -1 || true)
            echo "last ninja counter: ${last:-not reached}"
            # siso's own tally is the only cross-session progress signal: this is
            # how many targets were still pending when the budget ran out.
            summary=$(grep -oE '[0-9]+ done, [0-9]+ failed, [0-9]+ remaining' build.log | tail -1 || true)
            echo "::notice::${summary:-no siso summary in the log}"
            echo "remaining=$(printf '%s' "$summary" | awk '{print $5}')" >> "$GITHUB_OUTPUT"
            tail -n 20 build.log
          fi
          df -h /

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: titanium-arm64-unsigned
          path: chromium/src/out/release/*-unsigned.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Record whether this session produced an APK
        id: hasapk
        if: always() && inputs.action != 'probe'
        run: |
          set -euo pipefail
          if compgen -G "chromium/src/out/release/*.apk" >/dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "this session produced an APK; the publish job takes it from here"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the cached checkout
        if: always() && inputs.action != 'probe'
        timeout-minutes: 80
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same CDN resets as the restore side; see the retry() there.
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::gave up after $n attempts: $*" >&2
                return 1
              fi
              echo "attempt $n failed for: $* (retrying in $((n * 20))s)" >&2
              sleep $((n * 20))
            done
          }
          cd "$GITHUB_WORKSPACE"
          if compgen -G "chromium/src/out/release/*-unsigned.apk" >/dev/null \
             && [ '${{ steps.restore.outputs.had_apk }}' = 'true' ]; then
            echo "::notice::the APK was already in the restored tree and this session added nothing to cache; leaving it alone"
            exit 0
          fi
          if [ ! -f chromium/src/out/Default/.titanium-prepared ]; then
            echo "::warning::the checkout is not prepared (an unfinished sync); nothing to cache"
            exit 0
          fi
          previous='${{ steps.restore.outputs.generation }}'
          generation=$(( ${previous:-0} + 1 ))
          tag=$(printf 'g%03d' "$generation")
          rm -rf cache
          mkdir -p cache
          echo "::notice::cached tree objects=$(find chromium/src/out -name '*.o' 2>/dev/null | wc -l)"
          # --format=pax is the whole fix for the stalled chain. GNU tar's
          # default format stores mtimes to the whole second, but siso's deps
          # log records them to the nanosecond, so every restored object
          # looked *older than its own log entry* and was rebuilt:
          #   stale deps in depslog: output mtime "..." older than log:
          #   fs=2026-10-28 10:25:19 +0000 UTC depslog=...10:25:19.079711493
          # PAX headers carry the fractional seconds, so the next job's siso
          # finds the tree exactly as this one left it.
          tar --format=pax -I 'zstd -1 -T0' -cf cache/tree.tar.zst chromium
          split -b 1500M -d -a 3 cache/tree.tar.zst "cache/${tag}-part-"
          rm -f cache/tree.tar.zst
          parts=$(find cache -maxdepth 1 -name "${tag}-part-*" | wc -l)
          echo "cache ${tag}: ${parts} parts, $(du -sh cache | cut -f1)"
          gh release view build-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create build-cache --repo "$GITHUB_REPOSITORY" \
                 --title "Build cache (internal)" \
                 --notes "Machine-generated Chromium build cache for the chained build. Not a release; do not download." \
                 --prerelease
          # A reset reuses generation numbers, and a leftover part from a larger
          # earlier upload would break the part count on the next restore.
          gh release view build-cache --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' 2>/dev/null \
            | grep -E "^${tag}-part-" \
            | while read -r old; do
                gh release delete-asset build-cache "$old" --repo "$GITHUB_REPOSITORY" --yes >/dev/null
              done || true
          for f in cache/"${tag}"-part-*; do
            retry gh release upload build-cache "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          # The manifest is written last: a half-uploaded generation is never
          # advertised, so a later job either restores the previous one or fails
          # on the part count instead of extracting a truncated tar.
          recipe=$(
            { cat args.gn patch.sh .gclient 2>/dev/null
              git -C vanadium rev-parse HEAD 2>/dev/null || echo no-vanadium
            } | sha256sum | cut -d' ' -f1
          )
          printf 'generation=%d\nparts=%d\ncommit=%s\nrecipe=%s\nremaining=%s\n' \
            "$generation" "$parts" "$GITHUB_SHA" "$recipe" \
            "${{ steps.progress.outputs.remaining }}" > cache/manifest.txt
          gh release upload build-cache cache/manifest.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release view build-cache --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' \
            | grep -E '^g[0-9]{3}-part-' | grep -v "^${tag}-" \
            | while read -r stale; do
                gh release delete-asset build-cache "$stale" --repo "$GITHUB_REPOSITORY" --yes >/dev/null
              done || true
          df -h /

      - name: Report the session outcome
        if: always()
        run: |
          set -euo pipefail
          status='${{ steps.build.outputs.status }}'
          if [ -z "$status" ]; then
            if [ '${{ steps.restore.outputs.had_apk }}' = 'true' ]; then
              echo "::notice::the restored tree already held the APK; this session compiled nothing and handed it to the publish job"
              exit 0
            fi
            if [ '${{ inputs.action }}' = 'probe' ]; then
              echo "probe session: the build step never runs"
              exit 0
            fi
            echo "::warning::the build step produced no status; read the log above"
            exit 0
          fi
          if [ "$status" = "0" ]; then
            echo "this session completed the build"
            exit 0
          fi
          if [ "$status" = "124" ]; then
            echo "::notice::the session ended on its time budget; the next one is queued below"
            exit 0
          fi
          echo "::error::the build failed on its own error (status $status); the cached tree was kept, so a fix to build.sh or args.gn resumes from it"
          exit 1

      # Only a budget cut-off chains on. A build that failed on its own error
      # would fail the same way in the next session, so the job stays red and
      # waits for a fix.
      - name: Queue the next session
        if: always() && steps.build.outputs.status == '124'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in '${{ inputs.max_sessions }}' '${{ inputs.min_progress }}' '${{ inputs.build_minutes }}'; do
            case "$n" in ''|*[!0-9]*) echo "::error::$n is not a number of minutes or sessions" >&2; exit 2 ;; esac
          done
          if compgen -G "chromium/src/out/release/*-unsigned.apk" >/dev/null; then
            echo "the APK exists, so there is nothing left to queue"
            exit 0
          fi
          if [ '${{ inputs.auto_chain }}' != "true" ]; then
            echo "::notice::auto_chain=false; dispatch action=continue when you want the next session"
            exit 0
          fi
          pending='${{ steps.progress.outputs.remaining }}'
          previous='${{ steps.restore.outputs.pending }}'
          # A manifest from before this field existed carries no count, so the
          # first chained session after the change is not judged against it.
          if [ -n "$pending" ] && [ -n "$previous" ] && [ "$previous" -gt 0 ]; then
            gained=$(( previous - pending ))
            if [ "$gained" -lt '${{ inputs.min_progress }}' ]; then
              echo "::error::this session cleared only $gained of $previous pending targets, so the resumed tree is not carrying work forward; the chain is stopped. Compare the 'resumed tree objects' annotation of this run with its 'cached tree objects' annotation to see what the next job loses."
              exit 1
            fi
            echo "::notice::progress $previous -> $pending pending targets ($gained cleared)"
          fi
          gen='${{ steps.restore.outputs.generation }}'
          next=$(( ${gen:-0} + 1 ))
          if [ "$next" -gt '${{ inputs.max_sessions }}' ]; then
            echo "::error::stopped after $next sessions without an APK; raise max_sessions or fix the build"
            exit 1
          fi
          gh workflow run chained-build.yml --repo "$GITHUB_REPOSITORY" \
            -f action=continue \
            -f build_minutes='${{ inputs.build_minutes }}' \
            -f max_sessions='${{ inputs.max_sessions }}' \
            -f min_progress='${{ inputs.min_progress }}'
          echo "queued session $next with action=continue"

  # Signing is a separate, short job on purpose. The build job above runs
  # unattended for up to six hours a session, up to max_sessions times, on a
  # machine that also executes shell from the checkout; the release key must not
  # be on it. This job starts only when a session actually produced an APK, and
  # `environment: release` is what lets the two secrets sit behind required
  # reviewers: with reviewers configured, no run can take the key without you
  # approving it. Without those secrets it still publishes, as an unsigned
  # prerelease, so the workflow behaves the same as before until you set them.
  publish:
    needs: build
    # `!cancelled()` is required, not decorative: in sign mode the build job is
    # skipped, and a job whose dependency was skipped is skipped itself no
    # matter what its own condition says, unless the condition opts out of that
    # propagation with always()/!cancelled().
    if: >-
      !cancelled() &&
      (inputs.action == 'sign' || needs.build.outputs.has_apk == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read        # gh run download of this run's own artifact
    env:
      GH_TOKEN: ${{ github.token }}
      # common.sh's set_keys reads these two names, not the secret names.
      STORE_TEST_JKS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      LOCAL_TEST_JKS: ${{ secrets.RELEASE_LOCAL_PROPERTIES_B64 }}
      KEYSTORE_TYPE: ${{ vars.KEYSTORE_TYPE || 'PKCS12' }}
      EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
    steps:
      - name: Checkout the signing script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: common.sh
          sparse-checkout-cone-mode: false
          submodules: false

      - name: Get the APK to sign
        run: |
          set -euo pipefail
          mkdir -p in
          if [ '${{ inputs.action }}' = 'sign' ]; then
            # No build ran in this chain, so take the unsigned APK the last one
            # published. The newest *-unsigned prerelease wins; build-cache is
            # excluded because its tag does not end in -unsigned.
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
              --jq '[.[] | select(.prerelease and (.tag_name | endswith("-unsigned")))]
                    | sort_by(.created_at) | reverse | .[0].tag_name // empty')
            if [ -z "$tag" ]; then
              echo "::error::action=sign takes the APK from an existing titanium-<version>-unsigned release and there is none yet"
              exit 1
            fi
            echo "signing the APK from release $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p '*-unsigned.apk' -D in
          else
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              -n titanium-arm64-unsigned -D in
          fi
          ls -l in

      - name: Sign the APK
        id: sign
        run: |
          set -euo pipefail
          trap 'rm -rf ./keys' EXIT
          if [ -z "${STORE_TEST_JKS}" ] || [ -z "${LOCAL_TEST_JKS}" ]; then
            echo "::notice::RELEASE_KEYSTORE_B64 / RELEASE_LOCAL_PROPERTIES_B64 are not set in the release environment; publishing the unsigned build instead"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t apks < <(find in -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one APK in the artifact, found ${#apks[@]}"
            exit 1
          fi
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          . ./common.sh
          set_keys
          # Sizes only. A truncated or wrong keystore secret otherwise surfaces as
          # `DerInputStream.getLength(): lengthTag=NN, too big` from apksigner,
          # which names neither the secret nor what arrived.
          echo "decoded keystore bytes=$(wc -c < keys/test.jks), local.properties bytes=$(wc -c < keys/local.properties)"
          mkdir -p out
          # Drop the -unsigned marker: what comes out of sign_apk is signed.
          base=$(basename "${apks[0]}" .apk)
          target="out/${base%-unsigned}.apk"
          sign_apk "${apks[0]}" "$target"
          ls -l "$target"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "apk=$target" >> "$GITHUB_OUTPUT"

      - name: Verify the signature and the package identity
        if: steps.sign.outputs.signed == 'true'
        run: |
          set -euo pipefail
          apk='${{ steps.sign.outputs.apk }}'
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner=$(find "$ANDROID_HOME"/build-tools -type f -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME"/build-tools -type f -name aapt2 | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk" | tee certs.txt
          # apksigner labels the same digest two ways depending on the signature
          # scheme it verified: "Signer #1 certificate SHA-256 digest:" for the
          # jar/v1/v2 forms, "V3.0 Signer: certificate SHA-256 digest:" for v3.
          # Anchoring on either one alone leaves the variable empty, and an empty
          # digest reads as "signed by an unexpected key".
          digests=$(grep -Eio 'certificate SHA-256 digest: [0-9a-fA-F]{64}' certs.txt \
            | awk -F': ' '{print tolower($2)}' | sort -u)
          if [ -z "$digests" ]; then
            echo "::error::could not read a certificate digest from the apksigner output above"
            exit 1
          fi
          printf '%s\n' "$digests" | sed 's/^/signer certificate: /'
          if [ -n "${EXPECTED_CERT_SHA256}" ]; then
            expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
            if ! printf '%s\n' "$digests" | grep -qx "$expected"; then
              echo "::error::the APK is signed by none of the above but RELEASE_CERT_SHA256 is $expected; refusing to publish a build signed by an unexpected key"
              exit 1
            fi
            echo "certificate matches RELEASE_CERT_SHA256"
          fi
          "$aapt" dump badging "$apk" | sed -n '1,3p'

      - name: Publish the release
        run: |
          set -euo pipefail
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::gave up after $n attempts: $*" >&2
                return 1
              fi
              echo "attempt $n failed for: $* (retrying in $((n * 20))s)" >&2
              sleep $((n * 20))
            done
          }
          if [ '${{ steps.sign.outputs.signed }}' = "true" ]; then
            src='${{ steps.sign.outputs.apk }}'
            mode=signed
          else
            mapfile -t found < <(find in -name '*.apk')
            src="${found[0]}"
            mode=unsigned
          fi
          # The version is taken from the file name build.sh produced, so the tag
          # cannot disagree with the asset even if args.gn changes mid-chain.
          version=$(basename "$src" | sed -E 's/-arm64-v8a.*$//')
          if [ -z "$version" ] || [ "$version" = "$(basename "$src")" ]; then
            echo "::error::could not read the Chromium version from $(basename "$src")"
            exit 1
          fi
          asset=$(basename "$src")
          sha256sum "$src" > "$src.sha256"
          if [ "$mode" = signed ]; then
            tag="titanium-${version}"
            title="Titanium ${version} arm64"
            notes="Chromium/Titanium ARM64 build, signed with the repository release key and verified before upload. Built by the Chained build workflow; see the repository README for provenance. Generated by run ${GITHUB_RUN_ID}."
          else
            tag="titanium-${version}-unsigned"
            title="Titanium ${version} arm64 (unsigned build)"
            notes="Chromium/Titanium ARM64 build. UNSIGNED: it will not install until you sign it with your release key. Not a GrapheneOS release; see the repository README for provenance. Generated by run ${GITHUB_RUN_ID}."
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; replacing its assets"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes "$notes" \
              $( [ "$mode" = signed ] || echo --prerelease )
          fi
          # --clobber: re-running the chain rebuilds the same file names, and an
          # upload of an existing asset name without it fails.
          retry gh release upload "$tag" "$src" "$src.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          echo "::notice::published ${asset} (${mode}) and its sha256 on $tag"
