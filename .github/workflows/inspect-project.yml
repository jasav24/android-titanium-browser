name: Inspect project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/ui-protection.yml"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "patch.sh"
      - "args.gn"
      - "vanadium"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: inspect-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository discovery
        run: |
          python3 .github/scripts/discover.py \
            --repo "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/discovery-report"

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: discovery-${{ github.run_id }}
          path: discovery-report/
          if-no-files-found: warn
          retention-days: 14
