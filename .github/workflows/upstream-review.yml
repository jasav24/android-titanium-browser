name: Upstream review and auto-merge

on:
  pull_request:
    types:
      - closed
  issue_comment:
    types:
      - created
  workflow_run:
    workflows:
      - Validate build
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Candidate pull request number to evaluate for gated auto-merge"
        required: true
        type: string

permissions:
  contents: read

jobs:
  record:
    name: record-merge
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: automation-state-write
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted automation scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Read manifest policy
        id: manifest
        run: python3 .github/scripts/manifest_info.py

      - name: Prepare durable state worktree
        env:
          STATE_BRANCH: ${{ steps.manifest.outputs.state_branch }}
        run: |
          set -euo pipefail
          bash .github/scripts/state_branch.sh prepare \
            "$RUNNER_TEMP/automation-state" \
            "$STATE_BRANCH"

      - name: Record the merge
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          python3 .github/scripts/record_merge.py \
            --state-dir "$RUNNER_TEMP/automation-state" \
            --report-dir "$GITHUB_WORKSPACE/merge-report" \
            --event "$EVENT_PATH"

      - name: Save durable state
        env:
          STATE_BRANCH: ${{ steps.manifest.outputs.state_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bash .github/scripts/state_branch.sh save \
            "$RUNNER_TEMP/automation-state" \
            "$STATE_BRANCH" \
            "merge: PR #${PR_NUMBER} (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})"

      - name: Upload merge record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-record-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: merge-report/
          if-no-files-found: warn
          retention-days: 30

  precheck:
    name: precheck-automerge
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      should_merge: ${{ steps.resolve.outputs.should_merge }}
    steps:
      - name: Checkout trusted automation scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read manifest policy
        id: manifest
        run: python3 .github/scripts/manifest_info.py

      - name: Resolve the pull request and the opt-in controls
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          WORKFLOW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          AUTOMERGE_ENABLED: ${{ vars.UPSTREAM_AUTOMERGE_ENABLED }}
          POLICY_AUTOMERGE: ${{ steps.manifest.outputs.auto_merge }}
        run: |
          set -euo pipefail
          pr_number=""
          case "$EVENT_NAME" in
            issue_comment)
              if [ -z "$ISSUE_NUMBER" ] || [ -z "$(printf '%s' "${COMMENT_BODY:-}" | grep -E '^/automerge([[:space:]]|$)')" ]; then
                echo "::notice::Ignoring a comment that is not an /automerge command."
                echo "should_merge=false" >> "$GITHUB_OUTPUT"
                echo "pr_number=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              pr_number="$ISSUE_NUMBER"
              ;;
            workflow_run)
              pr_number="$WORKFLOW_PR"
              if [ -z "$pr_number" ] && [ -n "$WORKFLOW_HEAD_SHA" ]; then
                pr_number="$(gh api "repos/${REPO}/commits/${WORKFLOW_HEAD_SHA}/pulls" \
                  --jq '[.[] | select(.state == "open") | .number][0] // empty')"
              fi
              ;;
            workflow_dispatch)
              pr_number="$INPUT_PR"
              ;;
          esac

          if [ -z "$pr_number" ]; then
            echo "::notice::No pull request is associated with this run."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$pr_number" | grep -Eq '^[0-9]+$'; then
            echo "::error::could not resolve a numeric pull request number"
            exit 1
          fi

          pr_json="$(gh api "repos/${REPO}/pulls/${pr_number}")"
          labels="$(printf '%s' "$pr_json" | jq -r '[.labels[].name] | join(",")')"
          state="$(printf '%s' "$pr_json" | jq -r '.state')"
          merged="$(printf '%s' "$pr_json" | jq -r '.merged')"
          head_repo="$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name // ""')"

          should_merge="true"
          if [ "$state" != "open" ] || [ "$merged" != "false" ]; then
            echo "::notice::PR #${pr_number} is not open."
            should_merge="false"
          fi
          if [ "$head_repo" != "$REPO" ]; then
            echo "::notice::PR #${pr_number} is from a fork; gated auto-merge is limited to in-repository branches."
            should_merge="false"
          fi
          if ! printf '%s' "$labels" | grep -Eq '(^|,)automation-automerge(,|$)'; then
            echo "::notice::PR #${pr_number} does not carry the automation-automerge label."
            should_merge="false"
          fi
          if [ "$AUTOMERGE_ENABLED" != "true" ]; then
            echo "::notice::Repository variable UPSTREAM_AUTOMERGE_ENABLED is not true."
            should_merge="false"
          fi
          if [ "$POLICY_AUTOMERGE" != "true" ]; then
            echo "::notice::policy.auto_merge is false in the protection manifest."
            should_merge="false"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "should_merge=$should_merge" >> "$GITHUB_OUTPUT"

  merge:
    name: gated-automerge
    needs: precheck
    if: needs.precheck.outputs.should_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: upstream-automerge
    concurrency:
      group: automation-state-write
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.precheck.outputs.pr_number }}
      AUTOMERGE_ENABLED: ${{ vars.UPSTREAM_AUTOMERGE_ENABLED }}
    steps:
      - name: Checkout trusted automation scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Read manifest policy
        id: manifest
        run: python3 .github/scripts/manifest_info.py

      - name: Prepare durable state worktree
        env:
          STATE_BRANCH: ${{ steps.manifest.outputs.state_branch }}
        run: |
          set -euo pipefail
          bash .github/scripts/state_branch.sh prepare \
            "$RUNNER_TEMP/automation-state" \
            "$STATE_BRANCH"

      - name: Build a trusted event payload for the gate
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          DISPATCH_ACTOR: ${{ github.event.sender.login }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          PR_NUMBER: ${{ needs.precheck.outputs.pr_number }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          actor=""
          case "$EVENT_NAME" in
            issue_comment)
              actor="$COMMENT_ACTOR"
              ;;
            workflow_dispatch)
              actor="$DISPATCH_ACTOR"
              ;;
            workflow_run)
              actor="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/timeline?per_page=100" \
                --jq '[.[] | select(.event == "labeled" and .label.name == "automation-automerge")] | last | .actor.login // empty')"
              if [ -z "$actor" ]; then
                actor="$RUN_ACTOR"
              fi
              ;;
          esac
          if [ -z "$actor" ]; then
            echo "::error::could not identify the maintainer who requested auto-merge"
            exit 1
          fi
          jq -n --argjson pr "$pr_json" --arg actor "$actor" \
            '{sender: {login: $actor}, pull_request: $pr}' > "$RUNNER_TEMP/gate-event.json"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
          base_ref="$(printf '%s' "$pr_json" | jq -r '.base.ref')"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Evaluate the auto-merge gate
        run: |
          set -euo pipefail
          python3 .github/scripts/automerge_gate.py \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --head-sha "${{ steps.event.outputs.head_sha }}" \
            --base-ref "${{ steps.event.outputs.base_ref }}" \
            --state-dir "$RUNNER_TEMP/automation-state" \
            --event "$RUNNER_TEMP/gate-event.json" \
            --enabled "$AUTOMERGE_ENABLED"

      - name: Merge the exact verified head
        env:
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPO" \
            --squash --match-head-commit "$HEAD_SHA"
          for attempt in 1 2 3 4 5 6 7 8; do
            merged="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.merged')"
            if [ "$merged" = "true" ]; then
              break
            fi
            sleep 2
          done
          if [ "$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.merged')" != "true" ]; then
            echo "::error::PR #${PR_NUMBER} did not report as merged"
            exit 1
          fi

      - name: Record the auto-merge in durable state
        id: record
        env:
          PR_NUMBER: ${{ needs.precheck.outputs.pr_number }}
        run: |
          set -euo pipefail
          merged_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          merge_sha="$(printf '%s' "$merged_json" | jq -r '.merge_commit_sha // empty')"
          if [ -z "$merge_sha" ]; then
            echo "::error::merged PR has no merge commit SHA"
            exit 1
          fi
          jq -n --argjson pr "$merged_json" '{pull_request: $pr}' > "$RUNNER_TEMP/merged-event.json"
          python3 .github/scripts/record_merge.py \
            --state-dir "$RUNNER_TEMP/automation-state" \
            --report-dir "$GITHUB_WORKSPACE/merge-report" \
            --event "$RUNNER_TEMP/merged-event.json" \
            --merged \
            --merge-commit "$merge_sha"

      - name: Save durable state
        env:
          STATE_BRANCH: ${{ steps.manifest.outputs.state_branch }}
          PR_NUMBER: ${{ needs.precheck.outputs.pr_number }}
        run: |
          set -euo pipefail
          bash .github/scripts/state_branch.sh save \
            "$RUNNER_TEMP/automation-state" \
            "$STATE_BRANCH" \
            "merge: PR #${PR_NUMBER} (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})"

      - name: Upload merge record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: automerge-record-${{ needs.precheck.outputs.pr_number }}-${{ github.run_id }}
          path: merge-report/
          if-no-files-found: warn
          retention-days: 30
