name: Validate build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number (optional; leave empty to build a ref)"
        required: false
        type: string
        default: ""
      ref:
        description: "Branch/tag/SHA to build when no PR is supplied"
        required: false
        type: string
        default: ""
      mode:
        description: "auto/full run the Chromium build; lightweight runs checks only"
        required: true
        type: choice
        options:
          - auto
          - lightweight
          - full
        default: auto
      build_profile:
        description: "arm64-only is one APK and fits a 4-core host inside the build timeout"
        required: false
        type: choice
        options:
          - arm64-only
          - full
        default: arm64-only

permissions:
  contents: read

concurrency:
  group: validate-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      scripts_sha: ${{ steps.resolve.outputs.scripts_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      same_repo: ${{ steps.resolve.outputs.same_repo }}
      full_requested: ${{ steps.resolve.outputs.full_requested }}
      mode: ${{ steps.resolve.outputs.mode }}
      build_abis: ${{ steps.resolve.outputs.build_abis }}
      build_bundle: ${{ steps.resolve.outputs.build_bundle }}
      runner_labels: ${{ steps.manifest.outputs.runner_labels }}
      retention_days: ${{ steps.manifest.outputs.artifact_retention_days }}
      state_branch: ${{ steps.manifest.outputs.state_branch }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_BUILD_PROFILE: ${{ inputs.build_profile }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-build') }}
        run: |
          set -euo pipefail
          head=""
          base=""
          pr_number=""
          same_repo="true"
          full_requested="false"
          mode="auto"
          scripts_sha="$(git rev-parse HEAD)"

          # A dispatched build chooses its artifact set; every other trigger keeps
          # the historical full matrix so a PR gate is not silently narrowed.
          build_abis="arm arm64"
          build_bundle="true"
          case "${INPUT_BUILD_PROFILE:-full}" in
            arm64-only)
              build_abis="arm64"
              build_bundle="false"
              ;;
            full) ;;
            *)
              echo "::error::unknown build_profile: ${INPUT_BUILD_PROFILE}"
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" = "pull_request" ]; then
            head="$PR_HEAD_SHA"
            base="$PR_BASE_SHA"
            pr_number="$PR_NUMBER"
            if [ "$PR_HEAD_REPO" != "$REPO" ]; then
              same_repo="false"
            fi
            if [ "$FULL_LABEL" = "true" ]; then
              full_requested="true"
            fi
          elif [ -n "$INPUT_PR" ]; then
            pr_number="$INPUT_PR"
            mode="${INPUT_MODE:-auto}"
            pull_json="$(gh api "repos/${REPO}/pulls/${pr_number}")"
            head="$(printf '%s' "$pull_json" | jq -r '.head.sha')"
            base="$(printf '%s' "$pull_json" | jq -r '.base.sha')"
            head_repo="$(printf '%s' "$pull_json" | jq -r '.head.repo.full_name // ""')"
            if [ "$head_repo" != "$REPO" ]; then
              same_repo="false"
            fi
            labels="$(printf '%s' "$pull_json" | jq -r '[.labels[].name] | join(",")')"
            if [ "$mode" = "full" ]; then
              full_requested="true"
            elif [ "$mode" = "auto" ] && printf '%s' "$labels" | grep -Eq '(^|,)full-build(,|$)'; then
              full_requested="true"
            fi
          else
            mode="${INPUT_MODE:-auto}"
            if [ -n "$INPUT_REF" ]; then
              git fetch --no-tags origin "$INPUT_REF"
              head="$(git rev-parse FETCH_HEAD)"
            else
              head="$(git rev-parse HEAD)"
            fi
            base="$(git rev-parse "${head}^" 2>/dev/null || printf '%s' "$head")"
            if [ "$mode" = "full" ]; then
              full_requested="true"
            fi
          fi

          for value in "$head" "$base" "$scripts_sha"; do
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::could not resolve a full Git SHA (got: $value)"
              exit 1
            fi
          done

          {
            echo "head_sha=$head"
            echo "base_sha=$base"
            echo "scripts_sha=$scripts_sha"
            echo "pr_number=$pr_number"
            echo "same_repo=$same_repo"
            echo "full_requested=$full_requested"
            echo "mode=$mode"
            echo "build_abis=$build_abis"
            echo "build_bundle=$build_bundle"
          } >> "$GITHUB_OUTPUT"

      - name: Read manifest policy
        id: manifest
        run: python3 .github/scripts/manifest_info.py

  lightweight_validation:
    name: lightweight-validation-workflow
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    outputs:
      full_build_required: ${{ steps.policy.outputs.full_build_required }}
    steps:
      - name: Checkout trusted automation scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.scripts_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head
        env:
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            git fetch --no-tags origin \
              "+refs/pull/${PR_NUMBER}/head:refs/remotes/automation/pr-head" || true
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$HEAD_SHA"
          fi
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Create head worktree
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/head" "$HEAD_SHA"

      - name: Validate automation files in the pull request
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/reports"
          python3 .github/scripts/validate_automation.py \
            --repo "$RUNNER_TEMP/head" \
            --json-out "$GITHUB_WORKSPACE/reports/automation-validation.json"

      - name: Evaluate build policy
        id: policy
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/build_policy.py \
            --repo "$GITHUB_WORKSPACE" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --report-dir "$GITHUB_WORKSPACE/reports/build-policy" \
            > "$RUNNER_TEMP/build-policy.log"

      - name: Post build-gate for the lightweight path
        if: always() && needs.plan.outputs.same_repo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          SAME_REPO: ${{ needs.plan.outputs.same_repo }}
          FULL_REQUESTED: ${{ needs.plan.outputs.full_requested }}
          MODE: ${{ needs.plan.outputs.mode }}
          BUILD_REQUIRED: ${{ steps.policy.outputs.full_build_required }}
          REASON: ${{ steps.policy.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$FULL_REQUESTED" = "true" ] && [ "$SAME_REPO" = "true" ]; then
            echo "A full build was requested; build-gate will be posted after that build."
            exit 0
          fi
          if [ "$SAME_REPO" != "true" ]; then
            echo "::notice::Fork pull requests cannot write the build-gate check. Merge through an in-repository branch so a full build can be run and recorded."
            exit 0
          fi

          if [ "$BUILD_REQUIRED" = "true" ]; then
            conclusion="failure"
            title="Full Chromium build required"
            {
              echo "This change set requires a full Chromium build before merge."
              echo
              echo "Reasons: ${REASON:-an unclassified or build-affecting path changed}"
              echo
              if [ "$MODE" = "auto" ]; then
                echo "A full build is scheduled by this workflow and is subject to the"
                echo "\`chromium-build\` environment approval. This check will turn green"
                echo "only after that build succeeds and its exact tree is recorded."
              else
                echo "A maintainer must run **Validate build** with mode \`full\` for"
                echo "\`${HEAD_SHA}\`, or add the \`full-build\` label. The build must"
                echo "succeed and its artifacts must be recorded on the state branch."
              fi
              echo "Failed or missing builds cannot be merged."
            } > "$RUNNER_TEMP/gate.md"
          elif [ -z "$BUILD_REQUIRED" ]; then
            conclusion="failure"
            title="Build policy did not run"
            {
              echo "The build policy could not be evaluated, so this gate is red."
              echo
              echo "Open the \`lightweight-validation-workflow\` job for the earlier"
              echo "failure. A missing policy result is never treated as 'no build'."
            } > "$RUNNER_TEMP/gate.md"
          else
            conclusion="success"
            title="No full build required"
            {
              echo "The build policy determined that this change set does not need"
              echo "a full Chromium build. Lightweight validation ran for \`${HEAD_SHA}\`."
              echo
              echo "Reasons: ${REASON:-no build-affecting paths changed}"
            } > "$RUNNER_TEMP/gate.md"
          fi

          python3 .github/scripts/post_check.py \
            --repo "$REPO" \
            --sha "$HEAD_SHA" \
            --conclusion "$conclusion" \
            --title "$title" \
            --summary-file "$RUNNER_TEMP/gate.md" \
            --details-url "$RUN_URL"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ github.run_id }}
          path: |
            reports/
            ${{ runner.temp }}/build-policy.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish lightweight-validation check for the head commit
        if: always() && needs.plan.outputs.same_repo == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            conclusion="success"
            title="Lightweight validation passed"
            {
              echo "Static validation, manifest checks and build policy evaluation passed."
              echo
              echo "- Commit: \`${HEAD_SHA}\`"
            } > "$RUNNER_TEMP/lightweight.md"
          else
            conclusion="failure"
            title="Lightweight validation failed"
            {
              echo "Static validation or build policy evaluation did not pass."
              echo
              echo "- Commit: \`${HEAD_SHA}\`"
              echo "- Job status: \`${JOB_STATUS}\`"
            } > "$RUNNER_TEMP/lightweight.md"
          fi
          python3 .github/scripts/post_check.py \
            --repo "$REPO" \
            --sha "$HEAD_SHA" \
            --name lightweight-validation \
            --conclusion "$conclusion" \
            --title "$title" \
            --summary-file "$RUNNER_TEMP/lightweight.md" \
            --details-url "$RUN_URL"

  full_build:
    name: full-build
    needs:
      - plan
      - lightweight_validation
    if: |
      needs.plan.outputs.same_repo == 'true' &&
      needs.lightweight_validation.result == 'success' &&
      (needs.plan.outputs.full_requested == 'true' ||
       (needs.plan.outputs.mode == 'auto' && needs.lightweight_validation.outputs.full_build_required == 'true'))
    runs-on: ${{ fromJSON(needs.plan.outputs.runner_labels || '["self-hosted","linux","x64","chromium-build"]') }}
    environment: chromium-build
    timeout-minutes: 720
    permissions:
      contents: read
    env:
      BUILD_ABIS: ${{ needs.plan.outputs.build_abis }}
      BUILD_BUNDLE: ${{ needs.plan.outputs.build_bundle }}
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      version: ${{ steps.meta.outputs.version }}
      tree: ${{ steps.meta.outputs.tree }}
    steps:
      - name: Checkout pull request head and submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Preflight build host
        run: |
          set -euo pipefail
          python3 .github/scripts/discover.py \
            --build-host \
            --repo "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/build-preflight"

      - name: Create ephemeral test signing material
        run: |
          set -euo pipefail
          if ! command -v keytool >/dev/null 2>&1; then
            echo "::error::keytool is required to create the ephemeral test keystore"
            exit 1
          fi
          umask 077
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/automation-test.jks" \
            -storepass automationtest \
            -keypass automationtest \
            -alias automationtest \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Titanium Automation Test, OU=CI, O=Titanium, C=US"
          printf 'storePassword=automationtest\nkeyPassword=automationtest\nkeyAlias=automationtest\n' \
            > "$RUNNER_TEMP/local.properties"
          {
            echo "LOCAL_TEST_JKS=$(base64 -w0 "$RUNNER_TEMP/local.properties")"
            echo "STORE_TEST_JKS=$(base64 -w0 "$RUNNER_TEMP/automation-test.jks")"
          } >> "$GITHUB_ENV"
          echo "Ephemeral test signing material created (not a release key)."

      - name: Build Chromium APKs (test signing)
        timeout-minutes: 690
        run: |
          set -euo pipefail
          chmod +x build.sh common.sh patch.sh
          echo "Building ABIs: ${BUILD_ABIS} (bundle=${BUILD_BUNDLE})"
          ./build.sh

      - name: Verify and stage artifacts
        id: meta
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk64=(chromium/src/out/release/*-arm64-v8a.apk)
          apk32=(chromium/src/out/release/*-armeabi-v7a.apk)
          aab=(chromium/src/out/release/*-arm64-v8a.aab)
          want_arm=false
          case " ${BUILD_ABIS} " in *" arm "*) want_arm=true ;; esac
          problems=""
          if [ ${#apk64[@]} -ne 1 ]; then
            problems="${problems} arm64 APK: found ${#apk64[@]}, want 1"
          fi
          if [ "$want_arm" = true ] && [ ${#apk32[@]} -ne 1 ]; then
            problems="${problems} armv7 APK: found ${#apk32[@]}, want 1"
          fi
          if [ "${BUILD_BUNDLE}" = true ] && [ ${#aab[@]} -ne 1 ]; then
            problems="${problems} AAB: found ${#aab[@]}, want 1"
          fi
          if [ -n "$problems" ]; then
            echo "::error::artifact set does not match BUILD_ABIS='${BUILD_ABIS}' BUILD_BUNDLE='${BUILD_BUNDLE}':${problems}"
            find chromium/src/out/release -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi
          mkdir -p artifacts
          cp "${apk64[0]}" artifacts/
          if [ ${#apk32[@]} -eq 1 ]; then cp "${apk32[0]}" artifacts/; fi
          if [ ${#aab[@]} -eq 1 ]; then cp "${aab[0]}" artifacts/; fi

          version="${apk64[0]##*/}"
          version="${version%-arm64-v8a.apk}"
          tree="$(git rev-parse HEAD^{tree})"
          short="${tree:0:12}"
          artifact_name="titanium-test-${version}-${short}"

          build_tools="$(find chromium/src/third_party/android_sdk/public/build-tools \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          apksigner="$build_tools/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found in $build_tools"
            exit 1
          fi
          for file in artifacts/*.apk; do
            "$apksigner" verify --print-certs "$file" >/dev/null
          done

          if [ -x "$build_tools/aapt" ]; then
            dump_cmd=("$build_tools/aapt" dump badging)
          else
            dump_cmd=("$build_tools/aapt2" dump badging)
          fi
          badging="$("${dump_cmd[@]}" artifacts/*-arm64-v8a.apk)"
          expected="$(grep -o 'chrome_public_manifest_package = "[^"]*"' args.gn \
            | head -n1 | cut -d'"' -f2)"
          if [ -z "$expected" ] || ! printf '%s' "$badging" | grep -q "package: name='${expected}'"; then
            echo "::error::built APK package id does not match args.gn (${expected:-missing})"
            exit 1
          fi
          if [ ${#aab[@]} -eq 1 ]; then
            unzip -tq artifacts/*.aab >/dev/null
          fi

          (cd artifacts && sha256sum ./* > SHA256SUMS)
          {
            echo "version=$version"
            echo "tree=$tree"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"
          echo "Verified $version for tree $tree"

      - name: Upload full build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.retention_days || 14 }}

  record_build:
    name: record-build
    needs:
      - plan
      - full_build
    if: always() && needs.plan.outputs.same_repo == 'true' && needs.full_build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: automation-state-write
      cancel-in-progress: false
    permissions:
      contents: write
      checks: write
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.scripts_sha }}
          fetch-depth: 0

      - name: Fetch built commit
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$HEAD_SHA"
          fi
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Compute exact tree
        id: tree
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          echo "tree=$(git rev-parse "${HEAD_SHA}^{tree}")" >> "$GITHUB_OUTPUT"

      - name: Prepare durable state worktree
        env:
          STATE_BRANCH: ${{ needs.plan.outputs.state_branch || 'automation/state' }}
        run: |
          set -euo pipefail
          bash .github/scripts/state_branch.sh prepare \
            "$RUNNER_TEMP/automation-state" \
            "$STATE_BRANCH"

      - name: Download build artifacts
        if: needs.full_build.result == 'success' && needs.full_build.outputs.artifact_name != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.full_build.outputs.artifact_name }}
          path: ${{ github.workspace }}/downloaded

      - name: Record build marker
        id: record
        if: always()
        env:
          BUILD_RESULT: ${{ needs.full_build.result }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          TREE: ${{ steps.tree.outputs.tree }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          args=(
            --state-dir "$RUNNER_TEMP/automation-state"
            --tree "$TREE"
            --ref "$HEAD_SHA"
            --kind test
            --signing ephemeral
            --repository "$REPO"
            --run-url "$RUN_URL"
          )
          if [ "$BUILD_RESULT" = "success" ]; then
            shopt -s nullglob
            files=(downloaded/*)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::build succeeded but no artifacts were downloaded"
              exit 1
            fi
            for file in "${files[@]}"; do
              args+=(--artifact "$(basename "$file")=$file")
            done
            args+=(--result success)
          else
            args+=(--result failure)
          fi
          python3 .github/scripts/build_record.py "${args[@]}"

      - name: Publish state branch
        id: save
        if: always() && steps.record.outcome == 'success'
        env:
          BUILD_RESULT: ${{ needs.full_build.result }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          set -euo pipefail
          bash .github/scripts/state_branch.sh save \
            "$RUNNER_TEMP/automation-state" \
            "${{ needs.plan.outputs.state_branch || 'automation/state' }}" \
            "build: ${TREE} ${BUILD_RESULT} (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})"

      - name: Post build-gate
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          TREE: ${{ steps.tree.outputs.tree }}
          BUILD_RESULT: ${{ needs.full_build.result }}
          RECORD_OUTCOME: ${{ steps.record.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
          ARTIFACT_NAME: ${{ needs.full_build.outputs.artifact_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          conclusion="failure"
          if [ "$BUILD_RESULT" = "success" ] && [ "$RECORD_OUTCOME" = "success" ] \
             && [ "$SAVE_OUTCOME" = "success" ]; then
            conclusion="success"
          fi
          if [ "$conclusion" = "success" ]; then
            title="Exact-tree build passed"
            {
              echo "Full Chromium build succeeded and its artifacts were recorded."
              echo
              echo "- Commit: \`${HEAD_SHA}\`"
              echo "- Tree: \`${TREE}\`"
              echo "- Artifacts: \`${ARTIFACT_NAME}\`"
              echo "- State marker: \`builds/${TREE}.json\`"
            } > "$RUNNER_TEMP/result.md"
          else
            title="Full build not recorded"
            {
              echo "The full build did not produce a recorded artifact set for this commit."
              echo
              echo "- Build job result: \`${BUILD_RESULT}\`"
              echo "- Record step: \`${RECORD_OUTCOME}\`"
              echo "- State push step: \`${SAVE_OUTCOME}\`"
              echo
              echo "This check stays failed until a full build succeeds and is recorded."
            } > "$RUNNER_TEMP/result.md"
          fi
          python3 .github/scripts/post_check.py \
            --repo "$REPO" \
            --sha "$HEAD_SHA" \
            --conclusion "$conclusion" \
            --title "$title" \
            --summary-file "$RUNNER_TEMP/result.md" \
            --details-url "$RUN_URL"
